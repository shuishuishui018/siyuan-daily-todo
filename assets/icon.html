<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 160px; height: 160px; overflow: hidden; }
  .icon {
    width: 160px; height: 160px;
    background: linear-gradient(145deg, #4d7cfe 0%, #2b5fd9 55%, #1f4bb8 100%);
    border-radius: 34px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    /* 内高光，让图标在小尺寸下有立体感 */
    box-shadow: inset 0 1px 0 rgba(255,255,255,.28);
  }
  .glow {
    position: absolute; inset: 0; border-radius: 34px;
    background: radial-gradient(circle at 30% 18%, rgba(255,255,255,.30), transparent 58%);
  }
  svg { position: relative; display: block; }
</style>
</head>
<body>
  <div class="icon">
    <div class="glow"></div>
    <svg width="104" height="104" viewBox="0 0 104 104" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- 三行待办：上面两行已完成，第三行待完成 -->
      <rect x="10" y="14" width="22" height="22" rx="6" fill="#ffffff" opacity="0.95"/>
      <path d="M15.5 25.2 L19.6 29.3 L26.8 20.8" stroke="#2b5fd9" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="41" y="19" width="53" height="7.5" rx="3.75" fill="#ffffff" opacity="0.95"/>
      <rect x="41" y="30.5" width="34" height="6" rx="3" fill="#ffffff" opacity="0.55"/>

      <rect x="10" y="43" width="22" height="22" rx="6" fill="#ffffff" opacity="0.95"/>
      <path d="M15.5 54.2 L19.6 58.3 L26.8 49.8" stroke="#2b5fd9" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="41" y="48" width="45" height="7.5" rx="3.75" fill="#ffffff" opacity="0.95"/>
      <rect x="41" y="59.5" width="26" height="6" rx="3" fill="#ffffff" opacity="0.55"/>

      <rect x="10" y="72" width="22" height="22" rx="6" fill="none" stroke="#ffffff" stroke-width="3.2" opacity="0.95"/>
      <rect x="41" y="77" width="49" height="7.5" rx="3.75" fill="#ffffff" opacity="0.8"/>
      <rect x="41" y="88.5" width="30" height="6" rx="3" fill="#ffffff" opacity="0.42"/>
    </svg>
  </div>
</body>
</html>
