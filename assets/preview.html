<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 768px; overflow: hidden; }
  body {
    background: linear-gradient(155deg, #e9eefb 0%, #f4f7fd 45%, #eaf0fa 100%);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: #1f2430;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  /* 背景装饰光斑 */
  body::before {
    content: ''; position: absolute; width: 620px; height: 620px;
    right: -180px; top: -220px; border-radius: 50%;
    background: radial-gradient(circle, rgba(77,124,254,.18), transparent 66%);
  }
  body::after {
    content: ''; position: absolute; width: 460px; height: 460px;
    left: -150px; bottom: -170px; border-radius: 50%;
    background: radial-gradient(circle, rgba(120,90,255,.13), transparent 68%);
  }

  .window {
    width: 884px; height: 648px;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 26px 70px rgba(31,48,92,.20), 0 4px 14px rgba(31,48,92,.07);
    overflow: hidden;
    display: flex; flex-direction: column;
    position: relative;
    z-index: 2;
  }

  .titlebar {
    height: 54px; flex: 0 0 54px;
    border-bottom: 1px solid #eceff5;
    display: flex; align-items: center; gap: 10px;
    padding: 0 22px;
    background: #fbfcfe;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .titlebar .name { margin-left: 8px; font-size: 14px; color: #8b93a6; letter-spacing: .2px; }

  .body { flex: 1; display: flex; min-height: 0; }
  .tree {
    width: 196px; flex: 0 0 196px; border-right: 1px solid #eef1f6;
    padding: 20px 0; background: #fcfdff;
  }
  .tree .label { font-size: 12px; color: #a3aab9; padding: 0 20px 12px; letter-spacing: .5px; }
  .tree .item {
    padding: 9px 20px; font-size: 14px; color: #5a6377;
    display: flex; align-items: center; gap: 9px;
  }
  .tree .item.active {
    background: #eef4ff; color: #2b5fd9; font-weight: 600;
    border-right: 2.5px solid #4d7cfe;
  }
  .tree .item .ic { width: 15px; height: 15px; opacity: .7; }

  .doc { flex: 1; padding: 30px 38px; min-width: 0; overflow: hidden; }
  .doc h1 { font-size: 26px; font-weight: 700; letter-spacing: -.2px; margin-bottom: 4px; }
  .doc .sub { font-size: 13px; color: #98a0b0; margin-bottom: 22px; }

  .panel {
    border: 1px solid #e1e7f2;
    border-radius: 10px;
    background: linear-gradient(180deg, #fdfdff, #fafbff);
    padding: 18px 20px 14px;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 12px; border-bottom: 1px dashed #e6eaf3; margin-bottom: 6px;
  }
  .panel-head .t { font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .badge {
    font-size: 12px; color: #2b5fd9; background: #eaf1ff;
    border-radius: 999px; padding: 4px 11px; font-weight: 600;
  }

  .task { display: flex; align-items: flex-start; gap: 11px; padding: 11px 2px; }
  .box {
    width: 18px; height: 18px; flex: 0 0 18px; margin-top: 1px;
    border-radius: 5px; border: 1.8px solid #c2cad9; background: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .box.on { background: #4d7cfe; border-color: #4d7cfe; }
  .tick { width: 11px; height: 11px; }
  .task .txt { font-size: 15px; line-height: 1.5; color: #2a3140; }
  .task.done .txt { color: #9aa2b2; text-decoration: line-through; }
  .tag {
    font-size: 11px; color: #8a93a5; background: #f1f4f9;
    border-radius: 4px; padding: 2px 6px; margin-left: 7px;
    text-decoration: none; display: inline-block;
  }

  .panel-foot {
    margin-top: 8px; padding-top: 12px; border-top: 1px dashed #e6eaf3;
    font-size: 12px; color: #9aa2b2; display: flex; align-items: center; gap: 7px;
  }

  .brand {
    position: absolute; right: 30px; bottom: 26px;
    display: flex; align-items: center; gap: 10px; z-index: 3;
  }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(145deg, #4d7cfe, #1f4bb8);
    display: flex; align-items: center; justify-content: center;
  }
  .brand .txt { font-size: 13px; color: #7b8497; font-weight: 600; letter-spacing: .3px; }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="name">思源笔记 · 每日待办</span>
    </div>
    <div class="body">
      <div class="tree">
        <div class="label">文档树</div>
        <div class="item"><svg class="ic" viewBox="0 0 16 16" fill="none"><path d="M2 4.5A1.5 1.5 0 013.5 3h2.6l1.3 1.6h5.1A1.5 1.5 0 0114 6.1v5.4A1.5 1.5 0 0112.5 13h-9A1.5 1.5 0 012 11.5v-7z" stroke="#8b93a6" stroke-width="1.3"/></svg>工作日志</div>
        <div class="item"><svg class="ic" viewBox="0 0 16 16" fill="none"><path d="M2 4.5A1.5 1.5 0 013.5 3h2.6l1.3 1.6h5.1A1.5 1.5 0 0114 6.1v5.4A1.5 1.5 0 0112.5 13h-9A1.5 1.5 0 012 11.5v-7z" stroke="#8b93a6" stroke-width="1.3"/></svg>每日待办</div>
        <div class="item active">
          <svg class="ic" viewBox="0 0 16 16" fill="none"><rect x="2.5" y="3" width="11" height="10" rx="2" stroke="#2b5fd9" stroke-width="1.3"/><path d="M2.5 6.2h11" stroke="#2b5fd9" stroke-width="1.3"/></svg>2026-11-23 周一
        </div>
      </div>

      <div class="doc">
        <h1>2026-11-23 周一</h1>
        <div class="sub">今天要做的事</div>

        <div class="panel">
          <div class="panel-head">
            <div class="t">
              <svg width="17" height="17" viewBox="0 0 104 104" fill="none"><rect x="6" y="12" width="26" height="26" rx="7" fill="#4d7cfe"/><path d="M12 25l5 5 9-10" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="42" y="18" width="56" height="9" rx="4.5" fill="#c9d8fb"/><rect x="6" y="50" width="26" height="26" rx="7" fill="none" stroke="#4d7cfe" stroke-width="4"/><rect x="42" y="56" width="44" height="9" rx="4.5" fill="#c9d8fb"/></svg>
              今日待办
            </div>
            <span class="badge">3 待办 · 1 完成</span>
          </div>

          <div class="task done">
            <div class="box on"><svg class="tick" viewBox="0 0 12 12" fill="none"><path d="M2 6.2l2.6 2.6L10 3.4" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="txt">整理上周会议纪要</div>
          </div>

          <div class="task">
            <div class="box"></div>
            <div class="txt">回复客户关于交付时间的邮件<span class="tag">工作日志</span></div>
          </div>

          <div class="task">
            <div class="box"></div>
            <div class="txt">提交本周周报<span class="tag">@+2d</span></div>
          </div>

          <div class="panel-foot">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.2" stroke="#a8b0c0" stroke-width="1.3"/><path d="M8 5v3.6l2.3 1.4" stroke="#a8b0c0" stroke-width="1.3" stroke-linecap="round"/></svg>
            未完成的事项会在次日自动结转，带 @ 标记的会按时提醒
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="brand">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 104 104" fill="none"><rect x="6" y="12" width="26" height="26" rx="7" fill="#fff" opacity=".96"/><path d="M12 25l5 5 9-10" stroke="#2b5fd9" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="42" y="18" width="52" height="9" rx="4.5" fill="#fff" opacity=".8"/><rect x="6" y="50" width="26" height="26" rx="7" fill="none" stroke="#fff" stroke-width="4"/><rect x="42" y="56" width="40" height="9" rx="4.5" fill="#fff" opacity=".55"/></svg>
    </div>
    <div class="txt">每日待办</div>
  </div>
</body>
</html>
